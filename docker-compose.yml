version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vaultcore-postgres
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vaultcore
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgresql_schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - vaultcore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: vaultcore-mongodb
    environment:
      MONGO_INITDB_DATABASE: vaultcore
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - vaultcore
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vaultcore-backend
    ports:
      - "3001:3001"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: vaultcore
      DB_USER: postgres
      DB_PASSWORD: password
      MONGO_URI: mongodb://mongodb:27017/vaultcore
      JWT_SECRET: vaultcore-secret-key-2024-production
      ENCRYPTION_KEY: 32characterkeyforencryption12345
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - vaultcore
    command: npm start

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: vaultcore-ai
    ports:
      - "5000:5000"
    networks:
      - vaultcore
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vaultcore-frontend
    ports:
      - "3000:5173"
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_SOCKET_URL: http://localhost:3001
    networks:
      - vaultcore
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:

networks:
  vaultcore:
    driver: bridge